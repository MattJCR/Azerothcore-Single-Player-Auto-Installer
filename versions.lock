#   mod-quest-loot-party rehechos; claves y miembros migrados en todo el proyecto. Ver CHANGELOG.
# 2026-10-22: core (164 commits: DB/SAI, scripts BRD/BT/ToC, LFG: el explorador de bandas respeta ya
