#   VanillaPvpKeepAllEarnedTitles=0). Sin parches propios sobre ninguno de los
#   dos. Ver CHANGELOG.
# 2026-10-05: core f19a187 + mod-playerbots 037c014 (sin ganchos exclusivos del fork:
#   WorldSession::IsBot() -> IsHeadless(), PlayerbotScript -> ServerScript/PlayerScript/
#   WorldScript, BD de playerbots asíncrona), mod-dungeon-clear 60f3d98 y
#   mod-individual-progression 60336b3. Migrados los módulos propios y parche 02 de
#   mod-playerbots-wintergrasp. Ver CHANGELOG.
# 2026-10-07: mod-dungeon-clear a d224254 (8 commits: Pull Lab `.dc lab`, DPS esperan la
