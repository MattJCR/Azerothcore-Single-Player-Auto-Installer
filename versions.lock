#   compatibilidad con ambos nombres de miembros de PlayerbotAIConfig). Sin parches propios.
#   Ver CHANGELOG.
# 2026-10-12: core (175 commits) y mod-playerbots (26, #2854: las claves AiPlayerbot.* pasan a
